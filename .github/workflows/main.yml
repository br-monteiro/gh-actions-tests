name: Github Action Teste

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: "Tag value"
        required: true

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}
      - name: Display tag
        run: echo ${{ github.event.inputs.tag }}
      - name: Display test.txt
        run: cat ./test.txt

