name: Test
on:
  workflow_dispatch:

jobs:
  define-variable:
    name: Print version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: define variable
        run:  echo "SHA_6=${GITHUB_SHA::6}" >> $GITHUB_ENV

      - name: print value
        run: echo "sha_6=$SHA_6"
  print-variable:
    name: Print version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: print value
        run: echo "sha_6=$SHA_6"

