name: Test
on:
  workflow_dispatch:

jobs:
  define-variable:
    name: Define version
    runs-on: ubuntu-latest
    outputs:
      SHA_6: ${{ steps.define-variable.outputs.SHA_6 }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: define variable
        id: define-variable
        run: |
          echo "SHA_6=${GITHUB_SHA::6}" >> $GITHUB_ENV
          echo "SHA_6=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT
      - name: print value
        run: echo "sha_6=$SHA_6"
  print-variable:
    name: Print version
    runs-on: ubuntu-latest
    needs: define-variable
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: print value - outputs
        run: echo "sha_6=${{ needs.define-variable.outputs.SHA_6 }}"

      - name: print value - env
        run: echo "sha_6=${{ env.SHA_6 }}"

