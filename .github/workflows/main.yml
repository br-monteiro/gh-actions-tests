name: Test
on:
  workflow_dispatch:
    inputs:
      tag_value:
        description: "Tag value"
        required: true
      theme:
        description: "Theme"
        required: true
        default: zap
        type: choice
        options:
          - "zap"
          - "viva"
      aux_image_redis:
        description: "Build aux image redis"
        required: true
        type: boolean
        default: true
  release:
    types: [published]
env:
  TAG_REF: ${{ github.event.inputs.tag_value || github.ref_name }}
  TEST: ${{ github.event.inputs.aux_image_redis == 'true' || true }}

jobs:
  printer:
    name: Print version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: print
        run: echo ${{ env.TAG_REF }}

      - name: aux_image_redis
        run: echo ${{ env.TEST }}

      - name: aux_image_redis
        run: echo ${{ env.TEST }}

      - name: aux_image_redis
        if: ${{ env.TEST }}
        run: echo ${{ env.TEST }}

