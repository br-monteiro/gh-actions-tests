name: Test
on:
  workflow_dispatch:
    inputs:
      tag_value:
        description: "Tag value"
        required: true
      theme:
        description: "Theme"
        required: true
        default: zap
        type: choice
        options:
          - "zap"
          - "viva"
  release:
    types: [published]
env:
  TAG_REF: ${{ github.event.inputs.tag_value || github.ref_name }}

jobs:
  printer:
    name: Print version
    runs-on: ubuntu-latest
    steps:
      - name: print
        run: echo ${{ env.TAG_REF }}

      - name: Deploy to k8s
        env:
          ENVIRONMENT: 'qa'
          TAG: ${{ env.TAG_REF }}
          THEME: ${{ github.event.inputs.theme }}
          NAMESPACE: 'website'
        run: .deploy/bin/trigger.sh
