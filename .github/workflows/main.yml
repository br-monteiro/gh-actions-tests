name: Github Action Teste

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag value"
        required: true
  release:
    types:
      - published
env:
  IS_ALLOWED: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
jobs:
  check-tag:
    if: ${{ IS_ALLOWED }}
    runs-on: ubuntu-latest
    steps:
      - name: Select Tag Value
        id: select_tag
        run: |
          echo "git_tag_value=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "tag value: ${git_tag_value}"

