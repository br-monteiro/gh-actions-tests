name: Test
on:
  workflow_dispatch:
    inputs:
      default_tag:
        description: 'Build image with lates tag'
        default: true
        type: boolean
  release:
    types: [published]

env:
  DEFAULT_IMAGE_TAG: latest,${{ github.ref_name }}

jobs:
  show-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Set Docker image tag
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]] || [[ "${{ github.event.inputs.default_tag }}" == "false" ]]; then
            echo "Setting image tag to ref_name"
            echo "DEFAULT_IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Show image tag
        run: |
          echo "DEFAULT_IMAGE_TAG=${DEFAULT_IMAGE_TAG}"
