name: Test
on:
  push:
  workflow_dispatch:
    inputs:
      should_build_images:
        description: 'Build Docker Images?'
        type: boolean
        default: false
env:
  REPOSITORY: zap/squad-consideration/anonymous
jobs:
  define-variable:
    name: Define version
    runs-on: ubuntu-latest
    outputs:
      SHA_6: ${{ steps.define-variable.outputs.SHA_6 }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: define variable
        id: define-variable
        run: |
          echo "SHA_6=${GITHUB_SHA::6}" >> $GITHUB_ENV
          echo "SHA_6=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT
      - name: print value
        run: echo "sha_6=$SHA_6"
      - name: print var
        run: echo "url=${{ vars.FIRST_VAR }}"

  skiped:
    if: ${{ github.event.inputs.should_build_images == 'true' }}
    name: Skiped
    needs: define-variable
    runs-on: ubuntu-latest
    steps:
      - name: print value
        run: echo "passou"

  other:
    if: always()
    name: Other
    runs-on: ubuntu-latest
    env:
      IS_ALLOWED_TO_RUN: ${{ needs.skiped.result == 'skipped' || needs.skiped.result == 'success' }}
    needs:
      - define-variable
      - skiped
    steps:
      - name: print value
        if: ${{ env.IS_ALLOWED_TO_RUN == 'true' }}
        run: echo "passou"

      - name: print result
        if: ${{ env.IS_ALLOWED_TO_RUN == 'true' }}
        run: |
          echo "result: ${{ needs.skiped.result == 'skipped' }}"

      - name: print result
        if: ${{ env.IS_ALLOWED_TO_RUN == 'true' }}
        run: |
          echo "result: ${{ needs.skiped.result }}"


