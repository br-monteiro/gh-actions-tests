name: Tests

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: check if label is correct
        # if not contains, exit with error, so the workflow will not run
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'run:integration-tests') }}
        run: exit 1

      - run: echo "Running integration tests..."
        # Here you would add the actual commands to run your integration tests

      - name: Remove label
        if: always() # Ensure the label is removed even if tests fail
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: 'run:integration-tests'
